# RapidCTQA operational settings (committed, site-neutral defaults).
#
# Put site-specific values (storage share, network exposure, allowed DICOM
# senders) in webApp.local.yaml next to this file. It is git-ignored and is
# merged on top of this file. See webApp.local.example.yaml and
# docs/CONFIGURATION.md. Every key below is read by backend/settings.py.

app:
  name: RT CT Pre-Contour QA Portal
  version: 1.7.0

backend:

  api:
    host: "127.0.0.1"          # web dashboard / API bind address; 0.0.0.0 exposes it on the network
    port: 8080

  dicom_listener:
    host: "0.0.0.0"
    port: 11112
    aet: "RT_QA_SCP"
    allowed_calling_aets: []   # empty = any calling AE title (a warning is printed at startup)
    allowed_peers: []          # empty = any sender IP; otherwise CIDRs / IPs allowed to C-STORE
    stability_seconds: 30      # quiet time after the sender disconnects before a series is analysed

  storage:
    path: "data/rtct"          # relative paths are resolved against the repository root
    path_aliases: []           # see webApp.local.example.yaml
    retention_days: 1          # startup cleanup keeps series modified in the last N days (0 = never delete)

security:
  # Client networks allowed to use the dashboard / API.
  allowed_clients: ["127.0.0.1", "::1"]
  # Other web origins allowed to call the API from a browser. The dashboard is
  # served by the API itself and needs none.
  allowed_origins: []
