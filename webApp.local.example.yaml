# Copy to webApp.local.yaml (git-ignored) and adapt to your site.
# Values here are merged over webApp.yaml.

backend:

  api:
    host: "0.0.0.0"                       # serve the dashboard to other workstations

  dicom_listener:
    allowed_calling_aets: ["CT_SIM_1"]    # AE titles of your CT simulator / PACS
    allowed_peers: ["10.20.30.0/24"]      # their network

  storage:
    path: "\\\\fileserver\\DICOM\\rapidqa"
    # Map the share to whatever is reachable on this machine. The first
    # candidate that exists replaces the "from" prefix.
    path_aliases:
      - from: "\\\\fileserver\\DICOM"
        to: ["\\\\fileserver\\DICOM", "S:", "/Volumes/DICOM"]

security:
  # Clinician workstations allowed to open the dashboard (keep loopback).
  allowed_clients: ["127.0.0.1", "::1", "10.20.40.0/24"]
