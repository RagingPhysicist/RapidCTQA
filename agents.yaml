version: "1.2"
metadata:
  purpose: "Rapid Radiotherapy CT QA"
  system_threshold_unit: "Hounsfield Units (HU)"

agents:
  - name: "GeometryGuardian"
    role: "Truncation & FOV Detector"
    description: "Ensures the patient anatomy is fully contained within the reconstruction FOV while decoupling positioning accessories."
    parameters:
      skin_threshold: -200
      edge_buffer_px: 3
      couch_exclusion_margin_mm: 2.0
      couch_search_region_y_ratio: 0.55
      tissue_bridge_opening_mm: 5.0
      accessory_threshold_hu: -300
      lateral_tolerance_thorax_breast_mm: 15.0
      lateral_tolerance_head_neck_mm: 5.0
      lateral_tolerance_pelvis_mm: 0.0
    logic: |
      1. Stage 1 (Posterior Couch Exclusion): Detect primary horizontal carbon-fiber line in lower quadrant (y > 0.55 H); apply dynamic 2.0 mm boundary cutoff above couch surface plane.
      2. Stage 2 (Morphological Opening): Apply directional (vertical/lateral 5 mm) opening matrix to sever narrow tissue bridges connecting skin to vac-bags, wingboards, or headrests; isolate largest 3D connected component corresponding to human anatomy.
      3. Stage 3 (Dual Masking): Generate distinct, mutually exclusive masks: 'patient_body_mask' (patient tissue only) and 'accessory_table_mask' (couch, wingboard, vac-bag, immobilizers).
      4. Dual-Stage Truncation Classifier:
         - Condition A (Critical Failure): patient_body_mask intersects outermost border ring (<= 3 px) in A/P core sector OR exceeds protocol lateral thresholds -> FAIL_CRITICAL ("Patient Body Truncation Detected").
         - Condition B (Non-Critical Warning): accessory_table_mask intersects outermost border ring while patient_body_mask is intact -> PASS_WITH_WARNING ("Accessory / Positioning Device Truncated at FOV Edge").
         - Over-range air slices -> SKIPPED (EMPTY_SLICE).
         - Flared wingboard elbow clipping in Thorax/Breast (< 15 mm) -> PASS_WITH_WARNING.

  - name: "FluidPhysicist"
    role: "HU Accuracy Specialist"
    description: "Validates CT number constancy using internal biological markers."
    parameters:
      # Adjusted for patient data instead of phantom
      base_water_target: 0
      patient_fluid_tolerance: 35.0 
      contrast_tag: [0x0018, 0x0010]
    logic: |
      1. Check DICOM Contrast tag. If 'CONTRAST', set status to 'SKIPPED_CONTRAST'.
      2. Locate Bladder ROI using mid-range HU density.
      3. Calculate Median HU. 
      4. If 0 <= Median <= 35, return 'PASS' (accounts for 33.0 HU being normal urine/fluid).
      5. Only fail if Median > 40 without contrast.

  - name: "NoiseWhisperer"
    role: "Signal-to-Noise Analyst"
    description: "Differentiates between hardware noise and anatomical complexity."
    parameters:
      roi_size: 20
      max_air_sd: 15.0
    logic: |
      1. Crop 20x20px regions from the four extreme corners of the volume (Background Air).
      2. Calculate Standard Deviation (SD) of these regions.
      3. If SD_air < max_air_sd, return 'PASS'. 
      4. Note: High internal patient variance is ignored if background air is stable.

  - name: "CavityScout"
    role: "Air & Gas Auditor"
    description: "Detects large air pockets in bowel or stomach that impact dosimetry."
    parameters:
      air_threshold: -800
      max_gas_volume_cc: 15.0
      physiological_variance_threshold_cc: 15.0
    logic: |
      1. Isolate internal voxels < -800 HU within pelvic/abdominal region.
      2. If total gas volume <= 15.0 cc in pelvis, return 'PASS' (normal physiological variance).
      3. If 15.0 cc < gas volume <= 50.0 cc, flag 'CONDITIONAL' (moderate gas volume).
      4. If 50.0 cc < gas volume <= 100.0 cc, flag 'REJECT' (excessive gas volume).
      5. If gas volume > 100.0 cc, flag 'REJECT' (SEGMENTATION_LEAK).
      6. Non-pelvic scans bypass cavity alerts.

  - name: "ImplantAuditor"
    role: "High-Density Implant Detector"
    description: "Detects high-density metal implants, cardiac devices, or dental work inside the body."
    parameters:
      metal_threshold_hu: 2000
      min_metal_volume_cc: 0.05
    logic: "Isolate voxels > metal_threshold_hu inside body mask. Trigger a conditional warning if total volume exceeds min_metal_volume_cc."

  - name: "AlignmentAuditor"
    role: "Bilateral Reflection Symmetry Auditor"
    description: "Evaluates exact patient setup roll using Radon transform projection profiling around the 90-degree vertical axis to eliminate geometric and anatomical false positives."
    parameters:
      hu_floor: -300
      angular_step_deg: 0.1
      max_roll_tolerance_deg: 1.5
    logic: |
      1. Apply an HU floor mask at -300 to clear air artifacts.
      2. Generate a Radon sinogram sweep from 80 to 100 degrees around the vertical reflection plane.
      3. Compute the mirror cross-correlation coefficient for each angular slice profile.
      4. Locate the absolute peak correlation value. The deviation from 90.0 degrees represents the true patient roll.
      5. Trigger 'ROLL_ALERT' if the absolute deviation exceeds max_roll_tolerance_deg with a profile confidence score > 0.95.


  - name: "ReviewerAgent"
    role: "Gatekeeper"
    description: "Orchestrates doctor approval and records the final clinical decision."
    parameters:
      required_approver: "Radiation Oncologist"
    logic: |
      1. Collect flags from physics agents.
      2. If any flags present, set status to 'PENDING_REVIEW'.
      3. Display 'Approve' or 'Reject' buttons to the Doctor.
      4. On Reject: Generate 'RE-SCAN REQUIRED' alert.
      5. On Approve: Move DICOM to 'TPS_Inbound' folder.
orchestrator:
  mode: "parallel"
  error_handling:
    water_hu_33_fix: "If FluidPhysicist returns < 35 and non-contrast, downgrade 'Critical Failure' to 'Clinical Variance'."
    noise_fix: "Prioritize NoiseWhisperer.air_sd over internal image variance."
    table_vacbag_clipping_fix: "Downgrade table / vac-bag clipped at FOV edge to PASS_WITH_WARNING without critical stop."
    wingboard_elbow_fix: "Suppress flared wingboard elbow clipping in Thorax/Breast if depth < 15 mm to PASS_WITH_WARNING."
    empty_slice_fix: "Skip empty air slices above head / below feet as EMPTY_SLICE."
    pelvic_rectal_gas_fix: "Classify Pelvic Rectal Gas Volume < 15 cc as PASS (normal physiological variance)."